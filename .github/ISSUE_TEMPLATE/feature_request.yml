name: Feature request
description: Propose a feature or capability for OpenRelief.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What humanitarian or operational need does this address?
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Users
      description: Who would use this? Help seekers, volunteers, NGO coordinators, resource providers, maintainers, or others?
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should OpenRelief support?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: Could this affect personal data, urgency triage, public reporting, or volunteer safety?
    validations:
      required: true
