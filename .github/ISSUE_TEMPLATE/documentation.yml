name: Documentation improvement
description: Suggest or submit documentation improvements.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: document
    attributes:
      label: Document or section
      description: Which document or section should be improved?
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: What is unclear, missing, inaccurate, or hard to use?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: What should change?
